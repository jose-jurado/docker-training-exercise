# Active Model Configuration
name: TinyLlama-1.1B-Chat-v1.0
backend: llama-cpp
parameters:
  model: tinyllama-1.1b-chat-v1.0.Q4_K_M.gguf
context_size: 2048
threads: 4
temperature: 0.2
top_p: 0.95
top_k: 40
f16: true
template:
  chat: |
    <|system|>
    You are a helpful assistant.</s>
    <|user|>
    {{.Input}}</s>
    <|assistant|>
  completion: |
    {{.Input}}

