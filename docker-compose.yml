version: '3.8'

services:
  # 💬 Chatbot - Backend REST API service
  chatbot:
    # TODO: Build from the /chatbot/Dockerfile when ready
    #desde que carpeta coger el codigo , para consruit 
    build:
      context: ./Chatbot #carpeta como context
      dockerfile: Dockerfile #dockerfile 
    depends_on:
      - llm
      - encoder
      - vector-db
    environment:
      - LLM_URL=http://llm:4000             #para generar respuestas
      - VECTOR_DB_URL=http://vector-db:6333 #para hacer consultas rag
      - ENCODER_URL=http://encoder:8080     #para consultar embeddings
      - TOP_K_RESULTS=6
    networks:
      - rag-network
    ports:
      - "8080:8080"
    
  # 🎨 UI - Web interface
  ui:
    # TODO: Build from the /ui/Dockerfile when ready
    build:
      context: ./ui
      dockerfile: Dockerfile
    environment:
      - CHATBOT_API_URL=http://chatbot:8080
    networks:
    - rag-network
    ports:
    - "3000:3000"
  # 🧠 LLM - Language model for response generation
  llm:
  #aqui se usa imagen porque es un servicio de terceros
    image: ghcr.io/berriai/litellm:main-latest  
    container_name: llm
    ports:
    - "4000:4000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      # Montamos el config.yaml dentro del contenedor
    volumes: 
    - ./llm/config.yaml:/app/config.yaml    
    entrypoint: ["litellm"]
    command: ["--config", "/app/config.yaml"]  
    networks:
    - rag-network
    

  # 🔢 Encoder - Embedding model for vectorization
  # GPU VERSION:
  # encoder:
  #   image: ghcr.io/huggingface/text-embeddings-inference:latest
  #   container_name: encoder

  # CPU VERSION:
  encoder:
    image: ghcr.io/substratusai/stapi:latest
    container_name: encoder
    environment:
    - MODEL_ID=sentence-transformers/all-MiniLM-L6-v2 
    networks:
    - rag-network
    volumes:
    - encoder-data:/data  
    # TODO: complete the setup

  # 🗄️ Vector-DB - Document database with semantic search
  vector-db:
    image: qdrant/qdrant:latest
    container_name: vector-db
    volumes:
    - qdrant-storage:/qdrant/storage #es la ruta donde Qdrant guarda los datos dentro del contenedor
    networks:
    - rag-network
    #con esta red ,chatbot o data-indexer le pueden  hablar como http://vector-db:6333
    ports:
      - "6333:6333"
#buenas practicas healthcheck 
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 20s
      retries: 5
      start_period: 30s



  # ⚒️ Data-Indexer - Batch job for document processing
  data-indexer:
    # TODO: Build from the /data-indexer/Dockerfile when ready
    
    build:
      context: ./data-indexer
      dockerfile: Dockerfile
    environment:
      - ENCODER_URL=http://encoder:8080
      - VECTOR_DB_URL=http://vector-db:6333
      - COLLECTION_NAME=documents
    depends_on:
      - encoder
      - vector-db
    networks:
      - rag-network
    volumes:
      - ./resources:/data/resources #carpeta del pdf    
    command: ["--remove-existing-collection", "/data/resources/documents"]
    

networks:
  rag-network:
    driver: bridge

volumes:
  llm-data:
  encoder-data:
  qdrant-storage:
