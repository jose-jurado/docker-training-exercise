version: '3.8'

services:
  # 💬 Chatbot - Backend REST API service
  chatbot:
    build: ./chatbot
    container_name: chatbot
    ports:
    - "8080:8080"
    environment:
    - ENCODER_URL=http://encoder:8080
    - LLM_URL=http://llm:4000
    - VECTOR_DB_URL=http://vector-db:6333
    - COLLECTION_NAME=documents
    - TOP_K_RESULTS=2
    - MODEL_NAME=gpt-4o-mini
    - LITELLM_API_KEY=sk-litellm-test-123  # misma master_key
    depends_on:
    - encoder
    - vector-db
    - llm
    networks:
    - rag-network

  # 🎨 UI - Web interface
  ui:
    build: ./ui
    container_name: ui
    ports:
      - "3000:3000"
    environment:
      - CHATBOT_API_URL=http://chatbot:8080   # importante: NO localhost, sino nombre del servicio
    networks:
      - rag-network

  # 🧠 LLM - LiteLLM como proxy hacia ChatGPT
    
  llm:
    image: ghcr.io/berriai/litellm:main-latest   # ← cambia la imagen aquí
    container_name: llm
    ports:
      - "4000:4000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - ./llm/litellm-config.yaml:/app/config.yaml   # ← monta el archivo, no un directorio
    command: ["--config", "/app/config.yaml"]        # ← usa el mismo path que arriba
    networks:
      - rag-network

  # 🔢 Encoder - Embedding model para vectorización
  encoder:
    image: ghcr.io/substratusai/stapi:latest
    container_name: encoder
    environment:
      - MODEL=sentence-transformers/all-MiniLM-L6-v2
      - MODEL_ID=sentence-transformers/all-MiniLM-L6-v2
    ports:
      - "8001:8080"                    # host 8001 -> contenedor 8080 (stapi por defecto)
    networks:
      - rag-network

  # 🗄️ Vector-DB - Qdrant
  vector-db:
    image: qdrant/qdrant:v1.9.0
    container_name: vector-db
    ports:
      - "6333:6333"
    volumes:
      - qdrant-storage:/qdrant/storage
    networks:
      - rag-network

  # ⚒️ Data-Indexer - Batch job para indexar documentos
  data-indexer:
    build: ./data-indexer
    container_name: data-indexer
    networks:
      - rag-network
    volumes:
      - ./resources:/app/resources
    environment:
      - ENCODER_URL=http://encoder:8080
      - VECTOR_DB_URL=http://vector-db:6333
      - COLLECTION_NAME=documents
    depends_on:
      - encoder
      - vector-db

networks:
  rag-network:
    driver: bridge

volumes:
  llm-data:
  encoder-data:
  qdrant-storage:
